name: '02466_cpu'
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=2.2.6
  - matplotlib=3.10.3
  - pandas=2.3.0
  - pillow=11.2.1
  - requests=2.32.3
  - tqdm=4.67.1
  - segmentation-models-pytorch=0.5.0
  - transformers=4.52.4
  - scikit-learn=1.6.1
  - accelerate=1.7.0
  - natsort=8.4.0
  - wandb=0.20.1
  - pip=25.1.1
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - --extra-index-url https://developer.download.nvidia.com/compute/redist
    - torch==2.7.1
    - torchvision==0.22.0
    - -e ./solo-learn[dali,umap,h5]