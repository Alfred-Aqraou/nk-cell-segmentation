name: '02466_cuda'
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - conda-forge::numpy
  - conda-forge::matplotlib
  - conda-forge::pandas
  - conda-forge::pillow
  - conda-forge::requests
  - conda-forge::tqdm
  - conda-forge::segmentation-models-pytorch
  - conda-forge::transformers
  - conda-forge::scikit-learn
  - conda-forge::accelerate
  - conda-forge::natsort
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.7.0+cu126
    - torchvision==0.22.0+cu126